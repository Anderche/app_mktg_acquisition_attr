[project]
name = "attribution-dashboard"
version = "1.0.0"
description = "Acquisition & attribution dashboard on the GA4 obfuscated ecommerce sample"
authors = [{ name = "Anders Kiss" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "channelattribution==2.2.5",
    "duckdb==1.1.3",
    "fastapi==0.115.6",
    "matplotlib==3.9.2",  # imported by ChannelAttribution at load time
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "pydantic==2.10.3",
    "uvicorn[standard]==0.32.1",
]

[project.optional-dependencies]
bigquery = [
    "db-dtypes==1.3.1",
    "google-cloud-bigquery==3.27.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "ruff==0.8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
