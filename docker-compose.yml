services:
  app:
    build: .
    environment:
      ETL_SOURCE: ${ETL_SOURCE:-synthetic}
    volumes:
      - analytics-data:/app/data
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      start_period: 120s

volumes:
  analytics-data:
